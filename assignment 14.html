<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nested and Responsive Tables</title>
  <style>
    .table-wrap { max-width: 100%; overflow-x: auto; }
    table { border-collapse: collapse; }
    th, td { border: 1px solid #999; padding: 6px 10px; }
  </style>
</head>
<body>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Day</th><th>Lab Batches</th><th>Faculty</th><th>Room</th><th>Time</th></tr></thead>
      <tbody>
        <tr>
          <th>Friday</th>
          <td>
            <table>
              <tr><th>Batch</th><th>System</th></tr>
              <tr><td>A1</td><td>PC 1-20</td></tr>
              <tr><td>A2</td><td>PC 21-40</td></tr>
            </table>
          </td>
          <td rowspan="2">Dr. Sharma</td><td rowspan="2">Lab 2</td><td rowspan="2">2-4 PM</td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
