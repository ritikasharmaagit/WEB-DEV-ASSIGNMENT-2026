<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multimedia Demo</title>
</head>
<body>
  <h3>Image</h3>
  <img src="https://placehold.co/180x100?text=Image" alt="Sample placeholder image" width="180" height="100">
  <h3>Video</h3>
  <video controls width="320">
    <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
    Your browser does not support the video element.
  </video>
  <h3>Audio</h3>
  <audio controls>
    <source src="https://www.w3schools.com/html/horse.ogg" type="audio/ogg">
    Your browser does not support the audio element.
  </audio>
  <h3>YouTube</h3>
  <iframe width="320" height="180"
    src="https://www.youtube-nocookie.com/embed/ysz5S6PUM-U"
    title="Sample YouTube video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen></iframe>
</body>
</html>
