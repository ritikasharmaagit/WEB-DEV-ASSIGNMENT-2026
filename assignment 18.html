<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABC College Admission 2026</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; color: #222; }
    .container { width: min(92%, 520px); margin: 24px auto; background: white; }
    header, footer { background: #171b80; color: white; text-align: center; padding: 12px; }
    h1 { font-size: 22px; margin: 0; }
    main { padding: 16px; }
    h2 { font-size: 17px; text-align: center; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th, td { border: 1px solid #999; padding: 6px; text-align: left; }
    fieldset { margin-top: 14px; }
    label { display: block; margin-top: 10px; }
    input, select, textarea { box-sizing: border-box; max-width: 100%; }
    input[type="text"], input[type="email"], select, textarea { width: 100%; padding: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <header><h1>ABC College Admission 2026</h1></header>
    <main id="main">
      <h2>Courses and Fees</h2>
      <table>
        <caption>Available Courses</caption>
        <thead><tr><th>Course</th><th>Seats</th><th>Fees</th></tr></thead>
        <tbody>
          <tr><td>B.Tech CSE</td><td>120</td><td>₹90,000</td></tr>
          <tr><td>BCA</td><td>60</td><td>₹45,000</td></tr>
        </tbody>
      </table>
      <form action="#" method="post">
        <fieldset>
          <legend>Application Form</legend>
          <label for="student-name">Name:</label>
          <input type="text" id="student-name" name="name" required>
          <label for="student-email">Email:</label>
          <input type="email" id="student-email" name="email" required>
          <label for="student-course">Course:</label>
          <select id="student-course" name="course" required>
            <option value="">Select a course</option>
            <option>B.Tech CSE</option>
            <option>BCA</option>
          </select>
          <label for="statement">Statement:</label>
          <textarea id="statement" name="statement" rows="3" required></textarea>
          <button type="submit">Apply</button>
        </fieldset>
      </form>
    </main>
    <footer><small>&copy; 2026 ABC College</small></footer>
  </div>
</body>
</html>
